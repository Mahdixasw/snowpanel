name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org ir.snowpanel --project-name snowpanel .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          mkdir -p assets
          curl -fsSL -o assets/logo.png "https://snowpanel.ir/wp-content/uploads/2026/08/cropped-Picsart_26-08-21_02-12-52-515.png" || convert -size 512x512 xc:'#0D1630' -fill '#7DE3FF' -gravity center -pointsize 300 -annotate 0 '*' assets/logo.png
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="اسنو پنل"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: snowpanel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
